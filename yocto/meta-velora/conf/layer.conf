BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "velora"
BBFILE_PATTERN_velora = "^${LAYERDIR}/"
BBFILE_PRIORITY_velora = "10"

LAYERVERSION_velora = "1"
LAYERSERIES_COMPAT_velora = "wrynose"
# rockchip: RK3588 BSP (machine definition, U-Boot, rkbin); core: oe-core; rauc: meta-rauc (Story 6.12)
LAYERDEPENDS_velora = "core rockchip rauc"
