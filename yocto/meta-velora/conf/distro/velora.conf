# Velora distro (Story 1.4). Yocto 6.0 "Wrynose" LTS, systemd, GPLv3-free target image.
# defaultsetup.conf is included by bitbake.conf after the distro conf; do not require it here.

DISTRO = "velora"
DISTRO_NAME = "Velora"
DISTRO_VERSION = "0.1.0-dev"
DISTRO_CODENAME = "wrynose"
SDK_VENDOR = "-velorasdk"
MAINTAINER = "Velora <dev@velora.invalid>"

# AD: systemd is the init manager (NFR10 audio/RT service ordering, journald, serial-getty).
INIT_MANAGER = "systemd"
# rauc: Story 6.12 (meta-rauc enables its distro-level support and its sanity check wants the feature)
DISTRO_FEATURES:append = " systemd usrmerge rauc"
# Headless audio instrument: no desktop stacks, no bluetooth/wifi, no pulseaudio.
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan bluetooth wifi 3g nfc pulseaudio ptest"
# ptest pulls GPL-3.0 test dependencies (make) into the SDK/image dependency tree and is not wanted on a product image.

# Kernel: mainline linux-yocto 6.18 LTS (KERNEL-LTS-PLAN.md): no vendor kernel.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.18%"

# Licence policy (NFR27/NFR37, AR4): no GPL-3.0, LGPL-3.0 or AGPL-3.0 code in target images.
# The policy values live here; every Velora image recipe applies them as INCOMPATIBLE_LICENSE (see velora-image-dev.bb).
# Why per image and not a global INCOMPATIBLE_LICENSE: a global setting makes oe-core skip every GPLv3 recipe
# (bash, coreutils, tar, gawk, readline, ...), and systemd/opkg-utils/python3 name those in the RDEPENDS of sub-packages that are
# never installed, so the whole image stops resolving. Per image, oe-core checks the package set that is really installed
# into the rootfs (do_rootfs fails with "Some packages cannot be installed into the image because they have incompatible licenses").
# Native/nativesdk build tools are not part of the image and are not restricted.
# "GPL-3.0*" expands in oe-core to GPL-3.0-only and GPL-3.0-or-later (same for LGPL/AGPL). Hence:
#  - GPL-2.0-only components (kernel, BusyBox, U-Boot) are not matched and are allowed;
#  - GPL-3.0-with-GCC-exception (libgcc, libstdc++ in gcc-runtime) is not matched either: the GCC runtime library
#    exception makes them linkable into non-GPL programs, so no INCOMPATIBLE_LICENSE_EXCEPTIONS entry is needed (and none is set).
VELORA_INCOMPATIBLE_LICENSE = "GPL-3.0* LGPL-3.0* AGPL-3.0*"
VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS = ""

# /etc/os-release variant marker (Story 6.13). VELORA_VARIANT is set per build by the variant's kas file (kas/velora-<variant>.yml); the
# image recipe checks it against its own variant before assembling the rootfs, rauc-conf takes the keyring marker from it, and
# /etc/os-release states it as VARIANT_ID:
#   dev           VARIANT="Development"   velora-image-dev, velora-bundle-dev
#   factory-test  VARIANT="Factory test"  velora-image-factory-test, velora-bundle-factory-test
#   prod          VARIANT="Production"    PLACEHOLDER ONLY: documented here so the value is reserved, no image, bundle or keyring exists (Story 6.14)
VELORA_VARIANT ?= "dev"
OS_RELEASE_FIELDS:append = " VARIANT VARIANT_ID"
VARIANT = "${@{'dev': 'Development', 'factory-test': 'Factory test', 'prod': 'Production'}.get(d.getVar('VELORA_VARIANT'), 'UNKNOWN-VARIANT')}"
VARIANT_ID = "${VELORA_VARIANT}"

# Debug UART: serial-getty on the RK3588 debug console (UART2, 1.5 Mbaud).
SERIAL_CONSOLES = "1500000;ttyS2"

require conf/distro/include/velora-bootargs.inc
