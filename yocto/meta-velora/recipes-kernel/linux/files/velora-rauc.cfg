# Story 6.12: kernel options RAUC needs to install a verity bundle on the target (loop-mounted squashfs inside a dm-verity device).
# Applied only at kernel build: the first real build must audit the final .config for these (README: NOT verified).
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_CRYPTO_SHA256=y
