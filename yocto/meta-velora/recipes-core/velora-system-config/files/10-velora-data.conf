# Per-service data directories on the journaled /data partition (Story 6.11), per the AD-9 single-writer table.
# Created at boot by systemd-tmpfiles-setup (after local-fs.target, so /data is mounted). The root filesystem is read-only.
# Type Path           Mode  User             Group            Age Argument
d      /data/lib      0755  velora-librarian velora-librarian -   -
d      /data/catalog  0750  velora-librarian velora-librarian -   -
d      /data/livesets 0750  velora-engine    velora-engine    -   -
d      /data/config   0755  velora-sysd      velora-sysd      -   -
# Story 6.12: RAUC status (installed versions, install counters) must survive slot switches; the root slots are read-only.
d      /data/rauc     0755  root             root             -   -
