# RAUC system configuration of the Velora dev image (Story 6.12). Installed to /usr/lib/rauc/system.conf by rauc-conf.
# Slots are addressed by GPT partition name (wic --part-name in files/wic/velora-nvme.wks), never by nvme0n1pN.

[system]
compatible=Velora RK3588
# TODO(Story 1.6): "uboot" is the PLACEHOLDER bootloader backend. Story 1.6 chooses the boot chain (barebox or U-Boot with Rockchip tools);
# if barebox wins, this becomes bootloader=barebox with a barebox state (and files/uboot/ and fw_env.config are dropped).
bootloader=uboot
# Only PLAIN bundles are accepted. RAUC verifies the signature over the whole payload hash BEFORE it mounts or writes anything, so a flipped
# byte anywhere is rejected before any slot write (a verity bundle only detects payload corruption through dm-verity while copying, after
# the inactive slot was already being written). Cost: the whole bundle is read once for verification, and there is a time-of-check/
# time-of-use window if an attacker can rewrite the bundle file between verification and install (README, RAUC). crypt is not used.
bundle-formats=-verity -crypt
# The root slots are read-only: RAUC keeps its status (installed versions, install counters) on the persistent /data partition.
data-directory=/data/rauc
# Not set on purpose: max-bundle-download-size (no network install, sysd installs from a USB-A stick or Velora Studio, Story 8.x).

[keyring]
# The keyring of the image variant: ONLY the public certificate of that variant's RAUC root (dev root in the dev image, factory-test root in the factory-test image) (VELORA_RAUC_KEYRING_FILE, see rauc-conf.bbappend). No private key, ever.
path=/usr/lib/rauc/ca.cert.pem
# Check the certificate chain against the time the bundle was signed, not the device clock (no battery-backed clock guarantee).
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs.0
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs.1
type=ext4
bootname=B
