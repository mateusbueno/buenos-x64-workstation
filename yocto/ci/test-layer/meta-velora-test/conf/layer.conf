# Test-only layer for yocto/ci/validate.sh. NEVER referenced by kas/velora-dev.yml; added to bblayers only inside the validation container.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILE_COLLECTIONS += "velora-test"
BBFILE_PATTERN_velora-test = "^${LAYERDIR}/"
BBFILE_PRIORITY_velora-test = "5"
LAYERVERSION_velora-test = "1"
LAYERSERIES_COMPAT_velora-test = "wrynose"
LAYERDEPENDS_velora-test = "velora"

# Apply the distro licence policy to the test recipes and to the packages that must stay allowed, so the policy
# can be exercised at parse/dry-run level without a build (bitbake skips a recipe whose licence is incompatible).
INCOMPATIBLE_LICENSE:pn-test-gpl3 = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-test-gpl3 = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-test-lgpl3 = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-test-lgpl3 = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-test-agpl3 = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-test-agpl3 = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-test-gpl2 = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-test-gpl2 = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-busybox = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-busybox = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-linux-yocto = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-linux-yocto = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-gcc-runtime = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-gcc-runtime = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-libgcc = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-libgcc = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
INCOMPATIBLE_LICENSE:pn-u-boot = "${VELORA_INCOMPATIBLE_LICENSE}"
INCOMPATIBLE_LICENSE_EXCEPTIONS:pn-u-boot = "${VELORA_INCOMPATIBLE_LICENSE_EXCEPTIONS}"
