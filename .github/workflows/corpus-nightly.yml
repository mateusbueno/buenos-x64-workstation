name: corpus-nightly
# Story 5.4: the reference-corpus job (fetch + hash verify + import + sfizz null tests of the real libraries).
# MANUAL-ONLY like ci.yml (Actions minutes are limited, validation runs locally): `on:` has workflow_dispatch and nothing else.
# To make it nightly, add the two lines below under `on:` after the founder decides (kept commented out on purpose):
#   schedule:
#     - cron: "17 2 * * *"
# The job fails (non-zero exit of tools/corpus/corpus.py run) on any fetch / hash / import failure and on any null-test failure.
# Corpus audio lives only in the runner's cache directory, never in the checkout (tools/corpus/corpus.py guard enforces it).
# local_dir entries (founder-supplied Pianobook packs) CANNOT run on a hosted runner: their files exist only on the founder's machine and are never
# committed. By default this job runs `corpus.py ids --no-local` and prints a notice naming the local entries it did not run; run those locally
# (tools/corpus/README.md, "Local sources"). Naming one in the `only` input makes it fail with "local source not available", on purpose.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated entry ids to run (empty = every entry that does not need a local folder)"
        required: false
        default: ""

concurrency:
  group: corpus-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  corpus:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install libFLAC and protobuf
        run: brew install flac protobuf openssl@3
      - name: Offline unit tests and repository guard
        run: |
          python3 -m unittest discover -s tools/corpus/tests
          python3 tools/corpus/corpus.py check --require-pins
          python3 tools/corpus/corpus.py guard
      - name: Build host tools
        run: |
          cmake -S . -B build
          cmake --build build --target librarian velora-offline-render velora-null-test
      - name: Build the sfizz oracle (test tooling only, never shipped)
        run: tools/oracle/build-sfizz-render.sh
      - name: Restore the corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/velora-corpus
          key: velora-corpus-${{ hashFiles('tools/corpus/manifest.json') }}
      - name: Run the corpus (fails on any import or null-test failure)
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 tools/corpus/corpus.py ids --no-local > build/ids-hosted.txt
          python3 tools/corpus/corpus.py ids > build/ids-all.txt
          echo "::notice::NOT RUN on this runner (local_dir entries, files exist only on the founder's machine): $(comm -13 <(sort build/ids-hosted.txt) <(sort build/ids-all.txt) | tr '\n' ' ')"
          if [ -z "$ONLY" ]; then ONLY="$(tr '\n' ' ' < build/ids-hosted.txt)"; fi
          python3 tools/corpus/corpus.py run --out build/corpus-report --only $ONLY
      - name: Upload the report (no audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            build/corpus-report/report.md
            build/corpus-report/report.json
