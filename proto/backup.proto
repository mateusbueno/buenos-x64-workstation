// .velorabackup file schema (Story 9.16, Story 9.17, AD-12, AD-31, FR93, FR94).
// Full archival container for setlists, Live Sets, assign maps, tags and favorites.
// Factory and partner timbres are stored by reference only (library_id, instrument_key), never audio.
syntax = "proto3";

package velora.backup.v1;

import "setlist.proto";
import "live_set.proto";

enum FormatVersion {
  FORMAT_VERSION_UNSPECIFIED = 0;
  FORMAT_VERSION_1 = 1;
}

message VeloraBackup {
  uint32 format_version = 1;          // FormatVersion (Story 9.16, AD-12: N=1)
  string device_model = 2;            // e.g. "Velora 73"
  string firmware_version = 3;        // e.g. "1.2.0"
  string backup_time = 4;             // ISO-8601 UTC timestamp
  string notes = 5;                   // optional note ("Unsaved edits on the Velora are not in this backup")

  velora.setlist.v1.SetlistLibrary setlists = 6;
  velora.setlist.v1.AssignDefault assign_default = 7;
  repeated string favorites = 8;      // Live Set UUIDv4 strings
  repeated velora.liveset.v1.LiveSet live_sets = 9;
}

// Story 9.18: Partial exports (.velorasets, .veloratimbre)
enum ExportScope {
  EXPORT_SCOPE_UNSPECIFIED = 0;
  EXPORT_SCOPE_SETS = 1;
  EXPORT_SCOPE_TIMBRES = 2;
  EXPORT_SCOPE_BUNDLE = 3;
}

message ExportItemManifest {
  string id = 1;                      // Live Set UUID or timbre key
  string name = 2;                    // Display name
  string category = 3;                // Category display name
  uint64 size_bytes = 4;              // Byte size (0 for reference-only factory/partner timbres)
  bool is_reference_only = 5;         // True for factory and partner timbres
  string item_type = 6;               // "live_set" | "timbre"
  string library_id = 7;
  string instrument_key = 8;
}

message ExportTimbrePayload {
  string library_id = 1;
  string instrument_key = 2;
  string name = 3;
  string category = 4;
  bool is_reference_only = 5;         // True for factory/partner timbres
  bytes bundle_data = 6;              // Lossless formatlib bundle bytes (user timbres only; never factory)
}

message VeloraSetsExport {
  uint32 format_version = 1;          // FormatVersion (AD-12: N=1)
  string device_model = 2;            // e.g. "Velora 73"
  string firmware_version = 3;        // e.g. "1.4.0"
  string export_time = 4;             // ISO-8601 UTC timestamp
  ExportScope scope = 5;              // EXPORT_SCOPE_SETS or EXPORT_SCOPE_BUNDLE
  repeated ExportItemManifest manifest = 6;
  repeated velora.liveset.v1.LiveSet live_sets = 7;
  repeated ExportTimbrePayload timbres = 8; // In bundle scope
}

message VeloraTimbreExport {
  uint32 format_version = 1;          // FormatVersion (AD-12: N=1)
  string device_model = 2;            // e.g. "Velora 73"
  string firmware_version = 3;        // e.g. "1.4.0"
  string export_time = 4;             // ISO-8601 UTC timestamp
  repeated ExportItemManifest manifest = 5;
  repeated ExportTimbrePayload timbres = 6;
}

