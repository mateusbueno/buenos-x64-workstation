// Library API (Story 4.11, AR25 partial): the ws.v1 protocol between the `librarian` service and its clients (ui, engine-host, Velora Studio)
// over a Unix domain socket. Same conventions as ws_v1.proto: package ws.v1, PascalCase messages, snake_case fields, the schema only grows by
// addition and numbers are never reused, framing = 4-byte big-endian length + protobuf (LibraryClientMessage from the client,
// LibraryServerMessage from the server), the first message on every connection is the handshake (version + features), errors carry a code from
// a closed enum. Messages whose natural name already exists in ws_v1.proto (Hello, HelloAck, Error, Subscribe, State, Ack) carry a Library
// prefix so both files can be linked into one program. The largest frame is 262144 bytes (long Reconcile lists are chunked).
syntax = "proto3";

package ws.v1;

enum LibraryProtocolVersion {
  LIBRARY_PROTOCOL_VERSION_UNSPECIFIED = 0;
  LIBRARY_PROTOCOL_VERSION_1 = 1;
}

enum LibraryErrorCode {
  LIBRARY_ERROR_CODE_UNSPECIFIED = 0;
  LIBRARY_ERROR_CODE_UNSUPPORTED_VERSION = 1;  // the handshake named a version the server does not speak (connection closes)
  LIBRARY_ERROR_CODE_HANDSHAKE_REQUIRED = 2;   // first message was not LibraryHello (connection closes)
  LIBRARY_ERROR_CODE_MALFORMED_MESSAGE = 3;    // the frame did not parse as a message
  LIBRARY_ERROR_CODE_FRAME_TOO_LARGE = 4;      // length prefix above the limit (framing violation, connection closes)
  LIBRARY_ERROR_CODE_INVALID_COMMAND = 5;      // no command set, or a command that is not valid here
  LIBRARY_ERROR_CODE_INVALID_ID = 6;           // a Live Set id that is empty, longer than 64 bytes or holds characters outside [A-Za-z0-9._-]
  LIBRARY_ERROR_CODE_LIMIT_REACHED = 7;        // too many favorites (details: limit)
  LIBRARY_ERROR_CODE_STORAGE_FAILED = 8;       // the catalog could not be written (details: reason); nothing changed
  LIBRARY_ERROR_CODE_INTERNAL = 9;
  // Story 5.6 (additive; the import and catalog API). Every refusal below happens before anything is written.
  LIBRARY_ERROR_CODE_CATEGORY_REQUIRED = 10;   // an import item (or a per-instrument override) has no category, "none" or an unknown id (details: path, reason = `missing` when the category field is not set, `none` when it is set to 0, `unknown` for an id above 17)
  LIBRARY_ERROR_CODE_INVALID_SOURCE = 11;      // the source is missing / unreadable / not an SFZ, SF2 or folder, holds nothing importable, an item lies outside it, or an item is listed twice (details: path, reason)
  LIBRARY_ERROR_CODE_QUEUE_FULL = 12;          // too many import jobs are waiting (details: limit)
  LIBRARY_ERROR_CODE_UNKNOWN_JOB = 13;         // no such import job
  LIBRARY_ERROR_CODE_UNKNOWN_LIBRARY = 14;     // no such library in the catalog
  LIBRARY_ERROR_CODE_SHUTTING_DOWN = 15;       // the service is stopping and accepts no new import
  // Story 5.7 (additive).
  LIBRARY_ERROR_CODE_INSUFFICIENT_SPACE = 16;  // an import whose required bytes exceed the free bytes of the data file system (details: required_bytes, free_bytes, both decimal); nothing is written or queued
  LIBRARY_ERROR_CODE_UNKNOWN_PREFLIGHT = 17;   // no such preflight result (never made, or dropped: the service keeps the newest few)
  // Story 6.4 (additive).
  LIBRARY_ERROR_CODE_FACTORY_LIBRARY_PROTECTED = 18;  // an import (user import path) whose library_id is an installed Factory library: refused before anything is queued or written (details: path, library_id, reason=factory_library_protected). The same refusal found by the importer itself, after the request was accepted, ends the item FAILED with detail starting `factory_library_protected`
  // Story 8.12 (additive).
  LIBRARY_ERROR_CODE_RECONCILING = 19;         // the startup reconcile pass has not finished: no command is served yet (retry shortly; the handshake itself is answered). Nothing was changed
  // INVALID_COMMAND with details.reason=empty_reconcile: a Reconcile whose list is empty while the catalog is not (see Reconcile).
}

message LibraryError {
  LibraryErrorCode code = 1;
  string message = 2;                // human-readable, English, not for matching
  map<string, string> details = 3;
}

// --- handshake ------------------------------------------------------------------------------------
message LibraryHello {
  uint32 version = 1;                // = LIBRARY_PROTOCOL_VERSION_1
  repeated string features = 2;
  string client_name = 3;
}

message LibraryHelloAck {
  uint32 version = 1;
  repeated string features = 2;      // "library.v1", "favorites.v1", "recent.v1", "subscribe.v1", "import.v1", "catalog.v2" (Story 5.6), "preflight.v1" (Story 5.7), "import.checkpoints.v1" (Story 5.8), "install.protected.v1" and "library.kind.v1" (Story 6.4)
  uint32 catalog_schema_version = 3;
}

// --- commands -------------------------------------------------------------------------------------
message LibrarySubscribe {           // after this the server pushes FavoritesChanged / RecentChanged (and the current LibraryState right away)
  bool enable = 1;
}
message AddLiveSetFavorite { string live_set_id = 1; }
message RemoveLiveSetFavorite { string live_set_id = 1; }
message GetFavoritesAndRecent {}
message ReportLiveSetActive { string live_set_id = 1; }  // a Live Set became active; recorded in Recent (RAM now, SQLite at an idle-safe moment)
message LiveSetDeleted { string live_set_id = 1; }       // reconcile trigger: removes its favorite and recent rows
// Removes the favorite and recent rows of every Live Set not listed. Safety: an EMPTY list (after all chunks) while favorites or Recent exist is refused
// (INVALID_COMMAND, details reason=empty_reconcile) unless allow_empty is set, so a truncated or failed listing cannot wipe the catalog. A list too long for one
// frame is sent in chunks: every chunk but the last sets more=true; the ids accumulate on the connection (at most 100000) and the union is applied by the final
// chunk (more=false). A connection that closes before the final chunk applies nothing.
message Reconcile {
  repeated string existing_live_set_ids = 1;
  bool allow_empty = 2;
  bool more = 3;
}
message SetPlaying { bool playing = 1; }                 // the engine/ui says it is performing: Recent is not written while true
message FlushRecent {}                                   // an explicit safe-flush: writes Recent now if it has unwritten changes

// --- replies and pushes ---------------------------------------------------------------------------
message LibraryAck {
  bool changed = 1;                  // the command changed something (an idempotent add/remove that found nothing to do answers false)
}

message LibraryState {
  repeated string favorites = 1;     // in the order they were added (oldest first)
  repeated string recent = 2;        // most recent first, at most 20
  uint32 catalog_schema_version = 3;
  bool playing = 4;
  bool recent_unwritten = 5;         // Recent holds changes not yet written to SQLite
  uint64 recent_writes = 6;          // transactions that wrote Recent since the service started
  uint64 favorite_writes = 7;        // transactions that wrote favorites
}

message FavoritesChanged { repeated string favorites = 1; }
message RecentChanged { repeated string recent = 1; }

message FlushReply {
  bool written = 1;                  // a write happened (false: nothing was pending)
  uint64 recent_writes = 2;
}


// --- Story 5.6: libraries catalog and import ------------------------------------------------------
// Category ids are those of category.proto (1..17); 0 is "none" and is never accepted for an import.

// One file to import. For an SFZ the file is one instrument; for an SF2 the file is one library with one instrument per preset: `category` is the
// category of every preset and `instruments` overrides category and/or display name per preset ("bank:preset" keys). `name` is the display name of the
// library (and, for an SFZ, of its one instrument); empty = the name in the file.
message ImportInstrumentOverride {
  string key = 1;                    // instrument_key, e.g. "0:48" for an SF2 preset
  string name = 2;                   // empty = the preset name
  optional uint32 category = 3;      // not set = use the item's category; set to 0 = "none" = CATEGORY_REQUIRED
}
// Story 5.7: what to do with one row/file. DEFAULT = import (as in Story 5.6: an identical bundle that is already current ends `unchanged`). IMPORT = "Import
// again" on a row the preflight marked `already imported` (same effect, explicit). SKIP = leave the item out: it is not validated for a category, not counted
// for space, not queued; a request whose items are all SKIP is INVALID_COMMAND with details.reason=nothing_to_import; any other value is INVALID_COMMAND with
// details.reason=unknown_action.
enum ImportAction {
  IMPORT_ACTION_DEFAULT = 0;
  IMPORT_ACTION_IMPORT = 1;
  IMPORT_ACTION_SKIP = 2;
}
message ImportItem {
  string path = 1;                   // absolute, or relative to `source` when that is a folder
  optional uint32 category = 2;      // required, 1..17; presence matters: not set -> CATEGORY_REQUIRED reason missing, set to 0 -> reason none
  string name = 3;
  repeated ImportInstrumentOverride instruments = 4;
  ImportAction action = 5;           // Story 5.7; default (0) = IMPORT_ACTION_DEFAULT, which imports exactly as before
}
message ImportOptions {}             // reserved for the checkpoint settings of Story 5.8
// `source` is an .sfz / .sf2 file or a folder (the scan root). `items` are the files to import and each needs a category: for a file source the one item
// is the file itself (path empty or equal to `source`); for a folder the items name files inside it (any depth; relative paths are relative to the folder).
// No items, or any item (or per-instrument override) without a category or with "none", is CATEGORY_REQUIRED (at most 1000 items per request) and nothing is written. Each SFZ / SF2 is its
// own library (Story 5.1); files the request does not list are not imported.
message ImportRequest {
  string source = 1;
  repeated ImportItem items = 2;
  ImportOptions options = 3;
}
message ImportAccepted {
  uint64 job_id = 1;
  uint32 item_count = 2;
  uint64 bytes_total = 3;            // size of the source files
  uint32 queue_position = 4;         // 0 = starts at once; N = N jobs ahead of it
  // Story 5.7
  uint32 skipped_count = 5;          // items left out by action SKIP
  uint64 required_bytes = 6;         // the space check (see "Import space" in librarian/README.md)
  uint64 free_bytes = 7;             // free bytes of the data file system when the request was checked (0 when free_known is false)
  bool free_known = 8;               // false: the free space could not be read and the space check was skipped
}
// Story 6.4: install a protected bundle (a vendor pack made by tools/content-pack: bundle.vlrp, catalog.meta, catalog.meta.sig, wrapped-key.<device key id>.bin).
// Either `source_dir` (the pack directory; its `wrapped-key.*.bin` must be exactly one unless `wrapped_key_path` names the one for this device) or `bundle_path`
// (then catalog.meta, catalog.meta.sig and the wrapped key sit beside it unless named). The service reads them where they are (a mounted volume, a folder) and
// copies into <data>/lib/<library_id>/<bundle_id>/. `expected_library_id` (canonical UUID text, optional) must equal the bundle's library_id; without it the name of
// `source_dir` is used when it is a UUID. Answers ImportAccepted (item_count 1) and runs as a job on the librarian's worker: ImportProgress events, CancelImport,
// ImportStatusRequest and the terminal states behave as for an import (IMPORT_STATE_DRIVE_REMOVED when the volume goes away mid-install; the result item carries
// `install_reason`). Refusals before the job exists: INVALID_SOURCE (details path, reason source_missing | source_unreadable | bundle_missing |
// not_a_directory | bad_path), INVALID_COMMAND (reason install_target | invalid_library_id), INSUFFICIENT_SPACE (required = bundle size + reserve), SHUTTING_DOWN, QUEUE_FULL.
message InstallProtectedRequest {
  string source_dir = 1;
  string bundle_path = 2;
  string wrapped_key_path = 3;
  string catalog_meta_path = 4;
  string catalog_meta_seal_path = 5;
  string expected_library_id = 6;
}
message CancelImport { uint64 job_id = 1; }   // answers LibraryAck{changed=true} when the job was queued or running, false when it had already finished
message ImportStatusRequest { uint64 job_id = 1; }  // answers ImportProgress (the latest event of the job)

enum ImportState {
  IMPORT_STATE_UNSPECIFIED = 0;
  IMPORT_STATE_QUEUED = 1;
  IMPORT_STATE_RUNNING = 2;
  IMPORT_STATE_PUBLISHED = 3;        // terminal: the job ran to the end and at least one item is in the catalog (other items may still be skipped, see their results)
  IMPORT_STATE_FAILED = 4;           // terminal: nothing from this job reached the catalog (every item skipped or failed: an all-skipped job ends FAILED)
  IMPORT_STATE_CANCELLED = 5;        // terminal: cancelled; what was published before stays (earlier libraries; and the checkpoints of the SF2 that was running, see ImportItemResult.partial)
  IMPORT_STATE_DRIVE_REMOVED = 6;    // terminal (Story 5.8): the source disappeared mid-import (I/O errors or unmount). What finished is published, the timbre in progress was
                                     // discarded whole, earlier libraries are untouched; the final event carries the counts imported vs total (items_* and timbres_*)
}
enum ImportItemStatus {
  IMPORT_ITEM_STATUS_UNSPECIFIED = 0;
  IMPORT_ITEM_IMPORTED = 1;          // new bundle and/or `current` flipped
  IMPORT_ITEM_UNCHANGED = 2;         // the identical bundle was already current ("already imported")
  IMPORT_ITEM_SKIPPED = 3;           // the Story 5.1 reason codes below; nothing published - except that an SF2 skipped (damaged sample, ...) AFTER a checkpoint keeps the prefix of timbres that checkpoint published (`partial`)
  IMPORT_ITEM_FAILED = 4;            // infrastructure problem (I/O, busy, verification, catalog). Nothing of the failing bundle is published, but an SF2 that failed AFTER a checkpoint stays published as that prefix of its timbres (`partial`)
  IMPORT_ITEM_CANCELLED = 5;
  IMPORT_ITEM_DRIVE_REMOVED = 6;     // Story 5.8: the source went away while this item ran; `timbres` of its timbres are published (0: nothing), the rest was discarded
}
enum ImportReason {                  // the closed set of the import report (Story 5.1)
  IMPORT_REASON_NONE = 0;
  IMPORT_REASON_UNSUPPORTED_FEATURES = 1;
  IMPORT_REASON_DAMAGED = 2;
  IMPORT_REASON_DRIVE_REMOVED = 3;   // Story 5.8: an item that was not attempted because the source drive went away during an earlier item (status SKIPPED)
}
// Story 6.4: why a protected-bundle install was refused (the closed set of librarian/README.md, "Installing protected bundles"). Nothing is published, whatever the reason.
enum InstallReason {
  INSTALL_REASON_NONE = 0;
  INSTALL_REASON_SIGNATURE_INVALID = 1;   // the Ed25519 signature over the manifest does not verify
  INSTALL_REASON_UNTRUSTED_KEY = 2;       // the signer is not in the trusted content-signing keys of this image
  INSTALL_REASON_BLOCK_HASH_MISMATCH = 3; // a ciphertext block does not match its signed index hash
  INSTALL_REASON_HASH_LIST_MISMATCH = 4;
  INSTALL_REASON_CORRUPT_BUNDLE = 5;      // header, manifest or index damaged or truncated
  INSTALL_REASON_WRAPPED_KEY_INVALID = 6; // missing, ambiguous or not a well-formed wrapped_key_v1 (structure only; never unwrapped)
  INSTALL_REASON_ALREADY_INSTALLED = 7;   // with status UNCHANGED: the same bundle_id is already installed
  INSTALL_REASON_LIBRARY_ID_MISMATCH = 8; // the bundle is not the library the request named (expected_library_id, or the pack directory's name)
  INSTALL_REASON_NOT_PROTECTED = 9;       // an unprotected (older) format: never installed as a Factory library
  INSTALL_REASON_UNSUPPORTED_VERSION = 10;
  INSTALL_REASON_DOWNGRADE = 11;          // older than the bundle that is current for this library
  INSTALL_REASON_CATALOG_META_INVALID = 12; // catalog.meta / catalog.meta.sig altered, missing, sealed for another bundle or not matching the bundle
  INSTALL_REASON_LIBRARY_ID_IN_USE = 13;  // the library_id is a user library
  INSTALL_REASON_MISSING_FILE = 14;       // the bundle file does not exist
  INSTALL_REASON_IO_ERROR = 15;
}
message ImportOffender {
  string opcode = 1;
  string file = 2;
  uint32 line = 3;
  string message = 4;
}
message ImportItemResult {
  string path = 1;
  ImportItemStatus status = 2;
  ImportReason reason = 3;
  string failing_path = 4;
  repeated ImportOffender offenders = 5;
  repeated string messages = 6;
  string library_id = 7;
  string bundle_id = 8;
  uint32 instruments = 9;
  uint32 samples = 10;
  uint32 regions = 11;
  string detail = 12;                // the failure text of a failed item
  uint32 warning_count = 13;
  uint32 allowlisted_count = 14;
  uint32 suggested_category = 15;    // Story 5.5 suggestion (0 = none); informational
  uint32 timbres = 16;               // Story 5.8: timbres (SF2 presets; 1 for an SFZ) of this file that are in the published bundle
  uint32 timbres_total = 17;         // Story 5.8: timbres the file holds (0 when it could not be read)
  // Story 5.8: true when the item did NOT finish (status other than IMPORTED / UNCHANGED) but `timbres` > 0: a checkpoint published that many leading timbres of the file
  // before the item was cancelled, skipped, failed or the drive went away. They are in the catalog and playable; the rest is not; "Import again" completes the library.
  bool partial = 18;
  // Story 6.4: set on the result of a protected-bundle install (InstallProtectedRequest). INSTALL_REASON_NONE for an import and for an install that succeeded; on a
  // rejected install (status FAILED) the typed reason; INSTALL_REASON_ALREADY_INSTALLED with status UNCHANGED for an install that found the same bundle_id in place.
  InstallReason install_reason = 19;
  // Story 6.4: an install of a bundle that was already installed (status UNCHANGED) whose wrapped-key blob differed - the pack was re-delivered for this device - and
  // the stored `wrapped-key.bin` was replaced (atomically, after the same structural validation).
  bool wrapped_key_updated = 20;
}
// Pushed to the requester (and to every LibrarySubscribe subscriber) at each change of a job. event_seq grows by one per event of the job; items_done,
// the counters and bytes_done never decrease; the last event of a job has a terminal state and an empty current_item.
message ImportProgress {
  uint64 job_id = 1;
  uint64 event_seq = 2;
  ImportState state = 3;
  uint32 items_total = 4;
  uint32 items_done = 5;             // processed so far (imported + unchanged + skipped + failed + cancelled)
  uint32 items_imported = 6;
  uint32 items_unchanged = 7;
  uint32 items_skipped = 8;
  uint32 items_failed = 9;
  string current_item = 10;          // the file being processed
  uint64 bytes_total = 11;
  uint64 bytes_done = 12;
  ImportItemResult item = 13;        // set on the event that reports a finished item
  string message = 14;
  uint32 items_cancelled = 15;       // an item stopped by a cancel before its last bundle was published (the timbres of its earlier checkpoints, if any, stay published: see ImportItemResult.partial)
  // Story 5.8. Timbres are the unit of the checkpoints: an SF2 preset, or an SFZ file. timbres_total is counted when the job starts (an SF2 that cannot be
  // read counts 1); timbres_imported = timbres that are in a published bundle of this job (imported, unchanged or published by a checkpoint). `checkpoints`
  // counts the intermediate bundles published while an item was still converting (each also reaches the catalog); the event that reports one has no `item`.
  uint32 timbres_total = 16;
  uint32 timbres_imported = 17;
  uint32 checkpoints = 18;
  // Story 5.8: set while the catalog rows of a checkpoint could not be written (the bundle IS published; the next checkpoint or the end of the item retries the write,
  // the next start's reconcile lists it otherwise). Empty when the last write succeeded.
  string checkpoint_error = 19;
}

message ListLibraries {
  uint32 offset = 1;
  uint32 limit = 2;                  // 0 = 500
}
// Story 6.4: where a library comes from. USER (the default, also for every library of an older catalog) = imported from an SFZ / SF2, stored unencrypted.
// FACTORY = installed from a signed, protected vendor bundle; the librarian holds no key for it.
enum LibraryKind {
  LIBRARY_KIND_USER = 0;
  LIBRARY_KIND_FACTORY = 1;
}
message LibraryInfo {
  string library_id = 1;
  string name = 2;
  string source_kind = 3;            // "sfz" | "sf2"
  string source_path = 4;
  string bundle_id = 5;              // the current bundle
  uint32 instrument_count = 6;
  uint64 imported_seq = 7;           // import order (no wall clock: the unit has no RTC)
  LibraryKind kind = 8;              // Story 6.4
}
message LibraryList {
  repeated LibraryInfo libraries = 1;
  uint32 total = 2;
  uint32 offset = 3;
  bool more = 4;
}
message ListInstruments {
  string library_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;                  // 0 = 500
}
message InstrumentInfo {
  string instrument_key = 1;
  string name = 2;
  uint32 category = 3;               // 1..17
  uint32 sample_count = 4;
  uint32 region_count = 5;
  uint64 bytes = 6;                  // decoded PCM bytes of its samples
}
message InstrumentList {
  string library_id = 1;
  repeated InstrumentInfo instruments = 2;
  uint32 total = 3;
  uint32 offset = 4;
  bool more = 5;
}

// --- Story 5.7: import preflight -------------------------------------------------------------------
// Scans `source` (a mounted volume or a folder) for .sfz / .sf2 files WITHOUT converting anything, on the librarian's worker thread (the service thread
// keeps serving), reading headers only. The reply (PreflightDone, sent when the scan has finished, same request_id) carries the summary; the rows are
// paged with ListPreflightRows because a volume can hold up to 20000 files. The result stays in the service (the newest few) under `preflight_id`.
// Libraries are the top-level folders of the source; the files at its root form the first library, named `volume_label` (empty = the source folder's name).
// Each row is a timbre: an SFZ file, or one preset of an SF2 file.
enum PreflightStatus {
  PREFLIGHT_STATUS_UNSPECIFIED = 0;
  PREFLIGHT_STATUS_READY = 1;                         // a category is suggested (Story 5.5)
  PREFLIGHT_STATUS_NEEDS_CATEGORY = 2;                // no suggestion: the user must choose (FR21)
  PREFLIGHT_STATUS_SKIPPED_UNSUPPORTED_FEATURES = 3;  // the importer would skip it (Story 5.1 reason unsupported_features)
  PREFLIGHT_STATUS_SKIPPED_DAMAGED = 4;               // ... damaged
  PREFLIGHT_STATUS_ALREADY_IMPORTED = 5;              // the catalog already holds this library_id + instrument_key (default action SKIP)
}
message PreflightRequest {
  string source = 1;
  string volume_label = 2;           // names the library made of the files at the root of the source
  uint32 max_files = 3;              // 0 = 20000 (also the upper limit)
}
message CancelPreflight { uint64 request_id = 1; }  // the request_id of a PreflightRequest still running on THIS connection; answers LibraryAck{changed}
message PreflightLibrary {
  uint32 index = 1;
  string name = 2;
  string folder = 3;                 // top-level folder, relative to the source; empty for the root library
  uint32 rows = 4;
  uint32 ready = 5;
  uint32 needs_category = 6;
  uint32 skipped_unsupported_features = 7;
  uint32 skipped_damaged = 8;
  uint32 already_imported = 9;
}
message PreflightDone {
  uint64 preflight_id = 1;           // 0 when the scan was cancelled (nothing is kept)
  string source = 2;                 // canonical
  string volume_label = 3;
  repeated PreflightLibrary libraries = 4;   // at most 200 (libraries_total says how many exist; ListPreflightRows pages all rows)
  uint32 libraries_total = 5;
  uint32 rows_total = 6;
  uint32 ready = 7;
  uint32 needs_category = 8;
  uint32 skipped_unsupported_features = 9;
  uint32 skipped_damaged = 10;
  uint32 already_imported = 11;
  bool truncated = 12;               // a bound was reached (20000 files / entries / depth): the listing is partial
  bool cancelled = 13;
  uint32 files_scanned = 14;
  uint32 symlinks_skipped = 15;      // links that were not followed (linked folders, links leaving the source)
  uint64 bytes_read = 16;            // bytes read from the source files by the scan (headers only)
  uint64 duration_ms = 17;           // scan wall clock; a Mac figure is not representative of the board
  // Space for the rows whose default action is IMPORT (everything except already imported and skipped rows).
  uint64 pcm_bytes = 18;             // worst-case decoded size of those rows
  uint64 required_bytes = 19;        // 2 * pcm_bytes + reserve_bytes (0 when there is nothing to import). The DEFAULT selection only: a UI that changes the selection must add up PreflightRow.pcm_bytes itself (same formula), and an "Import again" of already imported rows needs the full amount too
  uint64 reserve_bytes = 20;         // the fixed reserve constant
  uint64 free_bytes = 21;            // free bytes on the data file system; 0 when free_known is false
  bool fits = 22;                    // free_known AND required_bytes <= free_bytes. false when the free space is unknown: read free_known (an import is still allowed then, the check is skipped)
  bool free_known = 23;
}
message ListPreflightRows {
  uint64 preflight_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;                  // 0 = 500
  optional uint32 library = 4;       // only the rows of that library index
}
message PreflightRow {
  string path = 1;                   // absolute path of the file: the `path` of an ImportItem
  string rel_path = 2;
  string name = 3;
  string format = 4;                 // "sfz" | "sf2"
  string library_id = 5;
  string instrument_key = 6;         // empty for a file that could not be parsed
  uint64 size_bytes = 7;
  uint64 pcm_bytes = 8;              // worst-case decoded size an import of this row writes (0 for a skipped row)
  uint32 suggested_category = 9;     // 0 = none
  PreflightStatus status = 10;
  ImportAction action = 11;          // the default action: SKIP for already imported and skipped rows, else IMPORT
  uint32 library = 12;               // index into PreflightDone.libraries
  string detail = 13;                // the first reason of a skipped row
}
message PreflightRowList {
  uint64 preflight_id = 1;
  repeated PreflightRow rows = 2;
  uint32 total = 3;
  uint32 offset = 4;
  bool more = 5;
}

message LibraryClientMessage {
  uint64 request_id = 1;
  oneof body {
    LibraryHello hello = 2;
    LibrarySubscribe subscribe = 3;
    AddLiveSetFavorite add_favorite = 4;
    RemoveLiveSetFavorite remove_favorite = 5;
    GetFavoritesAndRecent get_favorites_and_recent = 6;
    ReportLiveSetActive report_active = 7;
    LiveSetDeleted live_set_deleted = 8;
    Reconcile reconcile = 9;
    SetPlaying set_playing = 10;
    FlushRecent flush_recent = 11;
    ImportRequest import_request = 12;          // Story 5.6
    ListLibraries list_libraries = 13;
    ListInstruments list_instruments = 14;
    CancelImport cancel_import = 15;
    ImportStatusRequest import_status = 16;
    PreflightRequest preflight_request = 17;    // Story 5.7
    ListPreflightRows list_preflight_rows = 18;
    CancelPreflight cancel_preflight = 19;
    InstallProtectedRequest install_protected = 20;  // Story 6.4
  }
}

message LibraryServerMessage {
  uint64 request_id = 1;             // echoes the request; 0 for pushes
  oneof body {
    LibraryHelloAck hello_ack = 2;
    LibraryError error = 3;
    LibraryAck ack = 4;
    LibraryState state = 5;
    FavoritesChanged favorites_changed = 6;
    RecentChanged recent_changed = 7;
    FlushReply flush_reply = 8;
    ImportAccepted import_accepted = 9;         // Story 5.6
    LibraryList library_list = 10;
    InstrumentList instrument_list = 11;
    ImportProgress import_progress = 12;        // a push (request_id 0) or the answer to ImportStatusRequest
    PreflightDone preflight_done = 13;          // Story 5.7
    PreflightRowList preflight_rows = 14;
  }
}
