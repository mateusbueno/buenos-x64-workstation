}

message Ack {
  bool not_durable = 1;                  // Story 4.6: a setlist command was committed (the new file is in place) but the directory sync failed; the change is applied
}

// Story 3.10: a panel BUTTON frame pushed to subscribed clients (request_id 0). Only the engine produces it; it never goes through sysd.
message PanelEvent {
  uint32 button_id = 1;                  // MCU button id (mcu/common/MCU-ID-MAP.md section 7)
  bool pressed = 2;                      // true pressed, false released
  uint64 device_ns = 3;                  // the press / release time on the engine's host clock (CLOCK_MONOTONIC_RAW ns), drift-corrected from the panel MCU tick
}

message ServerMessage {
  uint64 request_id = 1;                 // 0 for pushed messages
  uint64 revision = 2;                   // snapshot revision after the command (unchanged on error)
  oneof body {
    HelloAck hello_ack = 10;
    Ack ack = 11;
    Error error = 12;
    State state = 13;
    PerformanceValues performance_values = 14;
    SceneReply scene_reply = 15;         // Story 4.4
    JumpReply jump_reply = 16;           // Story 4.5
    CancelLoadReply cancel_load_reply = 17;
    CreatedReply created_reply = 18;      // Story 4.6
    LoadSetlistReply load_setlist_reply = 19;
    StepReply step_reply = 20;
    SetlistsReply setlists_reply = 21;
    WriteReply write_reply = 22;          // Story 4.9
    DiagnosticsReply diagnostics_reply = 23;  // Story 1.21
    PanelEvent panel_event = 24;          // Story 3.10: pushed (request_id 0) to subscribers
    ConfigReply config_reply = 25;        // sysd config service: GetConfig / SetConfig reply, and the push to SubscribeConfig subscribers (request_id 0)
    PedalCalibrationReply pedal_calibration_reply = 26;  // Story 3.11: the reply to StartPedalCalibration / FinishPedalCalibration / CancelPedalCalibration
    PairReply pair_reply = 27;           // sysd TCP bridge only
    LibraryReply library_reply = 28;     // sysd TCP bridge only: a library reply or push (request_id as the client sent it, 0 for pushes)
    LiveSetViewReply live_set_view_reply = 29;  // Story 9.8: the reply to GetLiveSetView
  }
}
