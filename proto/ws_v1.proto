// ws.v1: the control protocol between the engine's control thread and its clients (ui, panel, Velora
// Studio) over a Unix domain socket. Framing: each message is a 4-byte big-endian length followed by
// that many bytes of protobuf (ClientMessage from the client, ServerMessage from the server); the
// largest frame is 65536 bytes. Rules (AD-2/AD-8): the schema only grows by addition, numbers are never
// reused, the first message on every connection is Hello, errors carry a code from the closed ErrorCode
// enum (clients treat an unknown value as an error), and a failed command changes nothing.
syntax = "proto3";

package ws.v1;

import "ws_v1_params.proto";  // generated from proto/params.json: ParamId, InsertType, PartOutput, ...

// Protocol version spoken by this schema. Hello.version must equal it.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_1 = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_VERSION = 1;  // Hello named a version the server does not speak (connection closes)
  ERROR_CODE_HANDSHAKE_REQUIRED = 2;   // first message was not Hello (connection closes)
  ERROR_CODE_MALFORMED_MESSAGE = 3;    // the frame did not parse as a message
  ERROR_CODE_FRAME_TOO_LARGE = 4;      // length prefix above the limit (framing violation, connection closes)
  ERROR_CODE_INVALID_COMMAND = 5;      // no command set, unknown command, or a command that is not valid here
  ERROR_CODE_UNKNOWN_PARAM = 6;        // param_id is not in the registry
  ERROR_CODE_OUT_OF_RANGE = 7;         // value outside the registry range (or not finite)
  ERROR_CODE_INVALID_PART = 8;         // part index above the last part
  ERROR_CODE_WRONG_CLASS = 9;          // a performance parameter sent as structural, or the reverse
  ERROR_CODE_WRONG_SCOPE = 10;         // parameter does not belong to this command's scope
  ERROR_CODE_INVALID_SLOT = 11;        // more insert slots than the chain holds
  ERROR_CODE_UNKNOWN_ENUM_VALUE = 12;  // enum value outside the registry enum
  ERROR_CODE_BUSY = 13;                // temporarily out of resources (too many unreclaimed generations, RT queue full)
  ERROR_CODE_INTERNAL = 14;
  ERROR_CODE_FX_BUDGET_EXCEEDED = 15;  // the insert chains, sends and master would cost more than the FX budget reserved by the arbiter (nothing changes)
  ERROR_CODE_NO_SUCH_SCENE = 16;       // RecallScene named a scene the loaded Live Set does not have (details: index, scene_count; nothing changes)
  ERROR_CODE_NO_LIVE_SET = 17;         // a scene command while no Live Set is loaded (nothing changes)
  ERROR_CODE_HEAD_BUDGET_EXCEEDED = 18;  // Story 4.5: the target Live Set's heads do not fit the head budget; the current Live Set keeps playing (details: head_bytes, head_budget)
  ERROR_CODE_LOAD_CANCELLED = 19;      // Story 4.5: a load was cancelled (CancelLoad, or superseded by another jump). INFORMATIONAL: never a failure to show the player
  ERROR_CODE_NO_SUCH_LIVE_SET = 20;    // Story 4.5: JumpToLiveSet named an id the engine does not list (details: id); nothing changes
  ERROR_CODE_LIVE_SET_LOAD_FAILED = 21;  // Story 4.5: the target could not be loaded and the current Live Set keeps playing (details: reason = read_failed |
                                         // invalid_live_set | part_count_unsupported | instrument_load_failed | arbiter_rejected | fx_budget_exceeded | busy | internal)
                                         // Story 4.6: also the typed refusal of NextLiveSet / PreviousLiveSet whose target file is missing or invalid (details: id, reason = missing |
                                         // read_failed | invalid_live_set); the position does not move and nothing is skipped
  // Story 4.6: setlists, tags and stepping. A failed command changes nothing.
  ERROR_CODE_NO_SUCH_SETLIST = 22;     // details: id
  ERROR_CODE_NO_SUCH_TAG = 23;         // details: id
  ERROR_CODE_DUPLICATE_LIVE_SET_IN_SETLIST = 24;  // the Live Set is already in this setlist (details: setlist_id, live_set_id)
  ERROR_CODE_INVALID_NAME = 25;        // name empty, longer than 64 bytes, not valid UTF-8 or holding a control character
  ERROR_CODE_END_OF_SETLIST = 26;      // NextLiveSet at the last Live Set of the loaded setlist (or of All Live Sets); State.setlists.end_of_setlist is set
  ERROR_CODE_START_OF_SETLIST = 27;    // PreviousLiveSet at the first Live Set (or before the first of a freshly loaded setlist); State.setlists.start_of_setlist is set
  ERROR_CODE_EMPTY_SETLIST = 28;       // stepping with a loaded setlist that holds no Live Set
  ERROR_CODE_LIMIT_REACHED = 29;       // too many setlists / tags / Live Sets in a setlist / tags on a setlist (details: limit_name = setlists | tags | live_sets_per_setlist | tags_per_setlist, limit)
  ERROR_CODE_LIVE_SET_IN_USE = 30;     // DeleteLiveSet of the Live Set that sounds or is loading
  ERROR_CODE_INVALID_ORDER = 31;       // a reorder that is not a permutation of the current ids, or an index past the end
  ERROR_CODE_LIVE_SET_NOT_IN_SETLIST = 32;  // RemoveLiveSetFromSetlist of a Live Set the setlist does not hold
  ERROR_CODE_STORAGE_FAILED = 33;      // the file could not be written (details: reason); nothing changed, EXCEPT details partial=references_removed_file_kept (DeleteLiveSet: the setlists were cleaned, the file could not be removed)
  // Story 4.9: edits and Write. A refused command changes nothing.
  ERROR_CODE_NAME_IN_USE = 34;         // WriteLiveSet SAVE_AS_NEW: the name is already used in the loaded setlist (details: name, suggested_name = a free name, e.g. "Perfect 2")
  ERROR_CODE_WRITE_SCOPE_UNAVAILABLE = 35;  // WriteLiveSet SCENE: details reason = timbre_change ("Timbre changes are saved with the Live Set") | no_scene | no_scenes | scene_not_in_saved
  ERROR_CODE_STORAGE_FULL = 36;        // WriteLiveSet: the storage is full (ENOSPC); nothing partial is written and the edits stay in memory, still flagged unsaved
  // Story 4.10: ASSIGN maps and encoders. A refused command changes nothing.
  ERROR_CODE_NOT_ASSIGNABLE = 37;      // SetAssignSlot: the parameter exists but cannot be driven by an encoder (structural, or marked non-assignable in the registry; details: param_id)
  // Story 4.12: Fader bindings with pickup. A refused command changes nothing.
  ERROR_CODE_NO_ORGAN = 38;            // SetFaderMode DRAWBARS requested with no organ part in the Live Set
  ERROR_CODE_NOT_ORGAN_PART = 39;      // SelectOrganPart for a part that is not an organ
  // Story 3.12: panel LEDs. A refused command changes nothing and sends no frame.
  ERROR_CODE_UNKNOWN_LED = 40;         // SetLed named a led_id that mcu/common/MCU-ID-MAP.md section 8 does not have (details: led_id)
  // Foundation: sysd config service. Spoken by velora-sysd only; the engine's control server answers the config messages with ERROR_CODE_INVALID_COMMAND.
  ERROR_CODE_INVALID_CONFIG = 41;      // SetConfig: a value that is individually in range but not valid (pedal min >= max, bad Live Set id, DEFAULT_LIVE_SET without an id);
                                       // details: field, reason. Nothing changes. Unknown enum values answer ERROR_CODE_UNKNOWN_ENUM_VALUE, values out of range ERROR_CODE_OUT_OF_RANGE,
                                       // an empty patch ERROR_CODE_INVALID_COMMAND, a config that could not be persisted ERROR_CODE_STORAGE_FAILED / ERROR_CODE_STORAGE_FULL
  // Foundation: the sysd TCP bridge (Velora Studio device connection). Spoken by the bridge only; the engine never produces them.
  ERROR_CODE_NOT_PAIRED = 42;          // an unpaired client sent anything but Hello / PairRequest; nothing was forwarded
  ERROR_CODE_UNSUPPORTED_FEATURE = 43; // the message belongs to a feature that was not negotiated in Hello (details: feature)
  ERROR_CODE_UPSTREAM_UNAVAILABLE = 44;  // the engine / librarian the command routes to is not reachable (details: upstream = engine | library, reason)
  ERROR_CODE_PAIRING_CODE_INVALID = 45;  // PairRequest with a wrong code (details: attempts_left)
  ERROR_CODE_PAIRING_CLOSED = 46;      // the pairing window is closed (details: reason = attempts | expired | not_open)
}

message Error {
  ErrorCode code = 1;
  string message = 2;                // human-readable, English, not for matching
  map<string, string> details = 3;   // e.g. param_id, part, limit
}

// --- handshake ------------------------------------------------------------------------------------
message Hello {
  uint32 version = 1;                // = PROTOCOL_VERSION_1
  repeated string features = 2;      // features the client can use; unknown ones are ignored by the server
  string client_name = 3;
  // Foundation: sysd TCP bridge (additive). Sent by Velora Studio; ignored by the engine and by the config service.
  string client_version = 4;         // the client application's version (informational; the protocol check is `version`)
  string client_id = 5;              // a stable id the client generates once (names the computer; NOT a credential)
  string pairing_token = 6;          // the secret returned by PairReply when this computer paired; the bridge pairs a Hello only with a valid token
}

message HelloAck {
  uint32 version = 1;
  repeated string features = 2;      // "params.v1", "snapshots.v1", "subscribe.v1"
  uint64 revision = 3;               // current snapshot revision
  // Foundation: sysd TCP bridge (additive; empty / false from the engine's own control server). `features` is then the NEGOTIATED set: the features
  // the client named that the device also speaks, plus "pairing.v1".
  string device_version = 4;         // the bridge's ws.v1 dialect as text ("1")
  string firmware_version = 5;
  string device_id = 6;              // stable id of this unit
  string model = 7;                  // "DEV HOST" under --dev-bypass-pairing
  bool paired = 8;                   // this session may send commands
}

// Foundation: sysd TCP bridge, pairing (reduced, Story 9.6 Mac scope). Allowed to an unpaired client (with Hello).
message PairRequest {
  string code = 1;                   // the pairing code shown by the unit
  string computer_name = 2;          // shown in the paired computers list (at most 64 bytes, control characters are dropped)
}

message PairReply {                  // a refusal is an Error (PAIRING_CODE_INVALID / PAIRING_CLOSED), never a PairReply with paired = false
  bool paired = 1;
  string computer_id = 2;
  string pairing_token = 3;          // 64 hex characters (256 random bits), returned ONCE; the unit keeps only its SHA-256. Present it in every later Hello
}

// Foundation: sysd TCP bridge, library forwarding. The library service speaks its own protocol (library_api.proto, LibraryClientMessage /
// LibraryServerMessage); the bridge carries those messages opaquely: `payload` is a serialised LibraryClientMessage (request_id inside is the client's) and the
// reply is a LibraryReply holding a serialised LibraryServerMessage. A library message larger than the ws.v1 frame limit cannot be relayed.
message LibraryRequest {
  bytes payload = 1;
}

message LibraryReply {
  bytes payload = 1;
}

// --- state ----------------------------------------------------------------------------------------
message ParamValue {
  ParamId param_id = 1;
  optional uint32 part = 2;          // part-scope parameters (required in the dev configuration); ignored for master scope
  float value = 3;
}

message InsertSlot {
  InsertType type = 1;
  bool bypass = 2;
  repeated float params = 3;         // up to 5 values (registry insert_param_1..5; the 5th is the compressor makeup, Story 2.8); missing ones keep the default
}

message PartState {
  uint32 part = 1;                   // 0..7
  uint32 timbre_ref = 2;             // opaque timbre reference
  repeated InsertSlot inserts = 3;   // ordered chain, up to 5 slots
  PartOutput output = 4;
  optional float send_reverb = 5;    // initial send levels; also present in State.performance_init
  optional float send_delay = 6;
  // Story 9.8 (additive): what Velora Studio's Live Set view needs to follow the sounding Live Set from State pushes (a scene recall and SetPartVolume publish a
  // new generation, so these change with every delta). Always filled by the server; `engine_type_id` is the core engine id (0 none, 1 sample, 2 organ, 3 FM, 4 VA);
  // `part_state` is why the part sounds or not (PART_RUN_STATE_*); `low_key` / `high_key` are the zone as played (0..127).
  float volume = 7;                  // 0..1 part fader
  bool keyboard_on = 8;              // false = the part receives no new notes ("OFF" in Studio)
  uint32 low_key = 9;
  uint32 high_key = 10;
  uint32 engine_type_id = 11;
  PartRunState part_state = 12;
  bool view_fields = 13;             // always true from a unit that fills fields 7..12 (an older unit leaves them absent, which JSON / serde clients read as zeros: Studio overlays a part only when this is set)
}

enum PartRunState {
  PART_RUN_STATE_READY = 0;              // the part sounds
  PART_RUN_STATE_EMPTY_TIMBRE = 1;       // a sample part with no timbre
  PART_RUN_STATE_MISSING_LIBRARY = 2;    // the timbre's library or instrument could not be resolved: silent, never a substitute
  PART_RUN_STATE_ENGINE_NOT_AVAILABLE = 3;  // FM / VA / unknown engine this build does not have
}

// The structural state of one snapshot generation. Also the format of the dev configuration file
// (engine/host/dev/engine-dev.json, JSON mapping of this message; `revision` is ignored there).
message State {
  uint64 revision = 1;
  repeated PartState parts = 2;          // always the tier's part count when sent by the server (8 on v1, 16 on Pro; State.tier.part_count)
  repeated ParamValue master = 3;        // structural master-scope parameters
  repeated ParamValue performance_init = 4;  // initial values of performance parameters: applied by RT on a generation
                                             // change only where they differ from the previous generation's, and they
                                             // never override a live value otherwise
  bool live_set_loaded = 5;              // Story 4.4: the current generation was built from a Live Set (additive)
  int32 current_scene = 6;               // the scene last recalled from the loaded Live Set; -1 = none (also without a Live Set)
  uint32 scene_count = 7;                // scenes in the loaded Live Set (0 without one)
  LoadingStatus loading = 8;             // Story 4.5: the state of the Live Set switch (background load); additive
  string live_set_id = 9;                // Story 4.5: id of the Live Set that sounds (the one last published by the engine), "" when none
  string live_set_name = 10;
  SetlistStatus setlists = 11;           // Story 4.6: the loaded setlist and the stepping position; additive
  EditStatus edits = 12;                 // Story 4.9: unsaved edits (dirty flag per Live Set, change summary of the current one); additive
  EncoderStatus encoders = 13;           // Story 4.10: the encoder mode, the selected part, the ASSIGN maps; additive
  ContentStatus content = 14;            // Story 6.5: protected-library integrity (counter and damaged libraries); additive
  FaderStatus faders = 15;               // Story 4.12: fader bindings, modes and pickup state; additive
  PreloadStatus preload = 16;            // Story 4.7: the next Live Set of the loaded setlist, preloaded within the head budget; additive
  TierStatus tier = 17;                  // Story 4.1: the tier profile the engine started with (read once, immutable); additive
}

// Story 4.1 (AD-27): the tier profile, read once at engine start from the board strap / OTP (the Mac host and an unreadable strap run v1; `--tier pro|v1` is a
// dev-only override). One image runs both tiers: these numbers are the profile's data, not behaviour switches. The budgets are placeholders until recalibrated
// on the board. Read-only; ui and sysd may use it to size what they show.
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_V1 = 1;
  TIER_PRO = 2;
}
message TierStatus {
  Tier tier = 1;
  string name = 2;                       // "v1" | "pro"
  uint32 part_count = 3;                 // parts a Live Set carries (8 | 16)
  uint64 head_budget_bytes = 4;          // the head (decoded PCM) budget of the switcher and loader
  uint64 arbiter_budget = 5;             // cost units of the whole voice pool
  uint64 fx_budget = 6;                  // cost units reserved for effects
  uint32 sample_floor_voices = 7;
  uint32 fm_floor_voices = 8;
  uint32 va_floor_voices = 9;
  bool sequencer_enabled = 10;           // the sequencer module (Pro only; not implemented yet)
}

// Story 4.7: the preload of the NEXT Live Set of the loaded setlist. `next_live_set_id` / `next_live_set_name` name the Live Set being (or to be) preloaded
// ("" = none: no setlist loaded, last Live Set of the setlist, or nothing sounds yet). `ready` is true only in READY: the next Live Set is fully resident and
// "next Live Set" swaps to it at the next block with no load wait. SKIPPED_BUDGET: the current and the next Live Set do not fit the head budget together (heads
// they share counted once); stepping then uses the ordinary background load. FAILED: the preload could not be staged (`detail` is the reason, e.g. read_failed,
// invalid_live_set, instrument_load_failed); stepping falls back to the ordinary load and reports its own typed error. `head_bytes_held` is the PCM the preload
// holds in addition to the sounding generation (shared heads are held once and not counted here; while LOADING the part loaded so far); 0 otherwise.
// `detail` carries a reason word only; the numbers of a verdict are in head_bytes_current (the sounding generation it was made against), head_bytes_needed and
// head_budget_bytes (the whole tier budget, shared by both generations).
enum PreloadState {
  PRELOAD_STATE_UNSPECIFIED = 0;
  PRELOAD_STATE_NONE = 1;
  PRELOAD_STATE_LOADING = 2;
  PRELOAD_STATE_READY = 3;
  PRELOAD_STATE_SKIPPED_BUDGET = 4;
  PRELOAD_STATE_FAILED = 5;
}
message PreloadStatus {
  PreloadState state = 1;
  bool ready = 2;                        // state == READY
  string next_live_set_id = 3;
  string next_live_set_name = 4;
  uint64 head_bytes_held = 5;
  uint64 head_budget_bytes = 6;          // the tier head budget the current and the preloaded generation share (0 = unlimited)
  uint64 head_bytes_current = 7;         // PCM of the sounding generation
  string detail = 8;
  uint64 status_seq = 9;                 // increases with every change of this status
  uint64 head_bytes_needed = 10;         // SKIPPED_BUDGET: PCM the next Live Set needs beyond the heads it shares with the current one
}

// Story 6.5: the integrity of protected (factory) libraries. `content_integrity` counts, since the engine started, the voices that faded to silence because
// the block they were about to read was damaged (it failed its hash check on an I/O edge thread); it is the real-time plane's counter, read lock-free.
// `damaged_library_ids` lists (at most 16, sorted; `damaged_library_count` is the true number) the libraries reported damaged: a damaged library stays reported
// until the engine restarts or the library is reloaded, and its damaged blocks stay silent. `damage_reports` counts the damaged blocks found (each block once, on its first detection; a repeated pass over the same damage adds nothing). `io_errors` counts reads of the edge threads that failed for a reason that says nothing about the block (nothing is marked damaged).
message ContentStatus {
  uint64 content_integrity = 1;
  uint32 damaged_library_count = 2;
  repeated string damaged_library_ids = 3;
  uint64 damage_reports = 4;
  uint64 io_errors = 5;
}

// Story 4.10: ASSIGN and the encoders. `mode` / `selected_part` are what the last SetEncoderMode / SelectPart commanded; `rt_mode` / `rt_selected_part` are
// what the real-time plane has applied (the same, one block later). `assign` is the ASSIGN map of the Live Set that sounds (K1..K8 = param ids, 0 = empty;
// empty list when no Live Set sounds); `assign_default` is the global default map (present when the engine has a data directory).
enum EncoderMode {
  ENCODER_MODE_UNSPECIFIED = 0;
  ENCODER_MODE_PART = 1;
  ENCODER_MODE_ALL = 2;
  ENCODER_MODE_ASSIGN = 3;
}
message EncoderStatus {
  EncoderMode mode = 1;
  uint32 selected_part = 2;
  EncoderMode rt_mode = 3;
  uint32 rt_selected_part = 4;
  repeated uint32 assign = 5;
  bool assign_default_available = 6;
  repeated uint32 assign_default = 7;
  uint64 steps_applied = 8;              // ASSIGN steps applied to a live value
  uint64 steps_empty_slot = 9;           // ASSIGN steps on an empty slot (nothing happened)
  uint64 steps_unrouted = 10;            // steps seen in PART / ALL mode (no function yet: Story 4.13)
  uint64 steps_rejected = 11;
  uint64 events_rejected = 12;           // mode / select-part events with a bad value
  uint64 steps_no_part = 13;             // part-scope steps whose target part has no engine: the live value moved, not counted as applied
  repeated float ring_values = 14;       // Story 4.13: normalized value 0.0 .. 1.0 (0-100% of range or offset) for encoders 1..8
  repeated uint32 ring_led_fills = 15;   // Story 4.13: 0..255 fill level for hardware LED rings
}

// Story 4.12: Fader bindings with pickup. Faders 1-8 control part volume and fader 9 controls REV master send
// in MIXER; in DRAWBARS they control drawbars 16'..1' of the selected organ part.
enum FaderMode {
  FADER_MODE_UNSPECIFIED = 0;
  FADER_MODE_MIXER = 1;
  FADER_MODE_DRAWBARS = 2;
}

enum FaderTargetType {
  FADER_TARGET_UNSPECIFIED = 0;
  FADER_TARGET_PART_VOLUME = 1;
  FADER_TARGET_REV_SEND = 2;
  FADER_TARGET_DRAWBAR = 3;
}

message FaderBindingState {
  uint32 fader_index = 1;          // 0..8 (Faders 1..9)
  FaderTargetType target_type = 2;
  string target_name = 3;          // human-readable target name
  uint32 target_part = 4;          // part index 0..7
  uint32 target_param_id = 5;      // registry param id (100..108, 801, or 0)
  float stored_value = 6;          // 0..1 normalized stored target value
  float physical_pos = 7;          // 0..1 normalized physical position
  bool is_pending = 8;             // true if pending pickup, false if taken over
}

message FaderStatus {
  FaderMode mode = 1;
  int32 selected_organ_part = 2;   // -1 if no organ part exists, else 0..7
  repeated FaderBindingState bindings = 3;
}

// Story 4.9: edits live in memory until a Write command. `dirty_live_set_ids` lists the Live Sets with unsaved edits (the current one included;
// at most 128 ids, `dirty_count` is the true number); `current_dirty` and the summary are those of the Live Set that sounds. A change item has a
// STABLE `key` (never reworded; clients localise from it), the `part` (0-based) / `param_id` / `scene` (0-based) it is about when they apply, and a
// pre-rendered English `text` for convenience ("Part 2 volume"; part and scene numbers in the text are 1-based). The summary lists at most 32
// items; `change_count` is the true number. Keys: tempo, part.timbre, part.engine, part.zone, part.octave, part.transpose, part.keyboard,
// part.volume, part.output, part.inserts, part.send_reverb, part.send_delay, part.arp, part.param, parts.list, master.param, assign.slot, scenes.list,
// scene.name, scene.part.<field> (same fields as part.*), scene.master.param.
message ChangeItem {
  string key = 1;
  optional uint32 part = 2;
  optional uint32 param_id = 3;
  optional int32 scene = 4;
  string text = 5;
  optional uint32 slot = 6;              // assign.slot: the 0-based ASSIGN slot (K1 = 0); part is not used for it
}
message EditStatus {
  bool available = 1;                    // the engine runs the edit session (a Live Set directory exists)
  repeated string dirty_live_set_ids = 2;
  uint32 dirty_count = 3;
  bool current_dirty = 4;
  repeated ChangeItem change_summary = 5;
  uint32 change_count = 6;
  string change_summary_text = 7;        // "Part 2 volume, Reverb send" (English, the first items; for logs and simple clients)
  bool has_timbre_edit = 8;              // the current Live Set has a pending timbre / engine assignment change
  bool scene_write_available = 9;        // WriteLiveSet SCENE would be accepted
  string scene_write_blocked_reason = 10;  // "" | timbre_change | no_scene | no_scenes
  uint64 edit_seq = 11;                  // increases with every change of the edits (also changes that do not move the revision)
  uint32 writes_done = 12;               // Write commands that wrote a file since the engine started
}

// Story 4.6: the setlist side of the State. `current_live_set_id` is the Live Set that sounds (as State.live_set_id). `last_setlist_position` is the index
// in the loaded setlist of the last Live Set that was current while inside it (-1 = none yet, or no setlist loaded); an off-script jump leaves it unchanged.
// `end_of_setlist` / `start_of_setlist` latch when a step was refused at that end and clear at the next change of position, Live Set or loaded setlist.
message SetlistStatus {
  bool available = 1;                    // the engine was started with a data directory (setlists are available)
  string loaded_setlist_id = 2;          // "" = no setlist loaded (stepping walks All Live Sets by name)
  string loaded_setlist_name = 3;
  int32 last_setlist_position = 4;
  string current_live_set_id = 5;
  bool end_of_setlist = 6;
  bool start_of_setlist = 7;
  uint32 setlist_count = 8;
  uint32 loaded_setlist_size = 9;        // Live Sets in the loaded setlist
  uint64 status_seq = 10;                // increases with every visible change (also flags that do not move the revision)
  uint64 library_revision = 11;          // increases with every persisted change of setlists / tags
  uint32 not_durable_commits = 12;       // commits since start whose directory sync failed (the change is applied and in place, but not known durable)
}

// Story 4.5: seamless Live Set switching. The state of the (single) background load. It is part of State and is pushed to subscribers whenever it
// changes and at least once per second while a load runs (the engine's control tick). `status_seq` increases with every publication.
enum LoadingState {
  LOADING_STATE_IDLE = 0;      // nothing has been requested yet, or the load was cancelled (see last_error: informational LOAD_CANCELLED)
  LOADING_STATE_LOADING = 1;   // the target's heads are being made resident; the current Live Set keeps playing and answering the keys
  LOADING_STATE_READY = 2;     // the last jump finished: the target is the Live Set that sounds
  LOADING_STATE_FAILED = 3;    // the last jump failed (last_error says why); the previous Live Set keeps playing
}
message LoadingStatus {
  LoadingState state = 1;
  bool loading = 2;                          // state == LOADING
  string target_id = 3;                      // the Live Set being loaded (or last requested)
  string target_name = 4;
  float estimated_remaining_seconds = 5;     // >= 0 and finite; 0 unless loading. Rate based (smoothed) on the bytes made resident so far
  float progress = 6;                        // 0..1, bytes resident / bytes of the target
  ErrorCode last_error = 7;                  // ERROR_CODE_UNSPECIFIED = none
  bool last_error_informational = 8;         // true for LOAD_CANCELLED: not an error to show
  string last_error_detail = 9;
  uint64 status_seq = 10;
  uint32 cancelled_loads = 11;               // loads cancelled or superseded since the engine started
  uint64 bytes_loaded = 12;
  uint64 bytes_total = 13;
}

// The gain reduction a compressor applied in its last block (Story 2.8), published by the engine; read-only state, not a parameter.
enum GainReductionScope {
  GAIN_REDUCTION_SCOPE_INSERT = 0;       // the compressor in insert slot `slot` of part `part`
  GAIN_REDUCTION_SCOPE_MASTER_MAIN = 1;  // the master compressor of the Main bus (part and slot are 0)
  GAIN_REDUCTION_SCOPE_MASTER_AUX = 2;   // the master compressor of the Aux bus
}

message GainReduction {
  GainReductionScope scope = 1;
  uint32 part = 2;                       // 0..7 (insert scope)
  uint32 slot = 3;                       // 0..4 (insert scope)
  float gain_reduction_db = 4;           // >= 0; 0 = not reducing, bypassed or no signal above threshold
}

message PerformanceValues {              // live values from the RT last-value table
  repeated ParamValue values = 1;
  repeated GainReduction gain_reductions = 2;  // one per insert slot that holds a compressor in the current snapshot, plus the two
                                               // master compressors (Main, Aux); additive, older clients ignore it
  int32 current_scene = 3;               // Story 4.4: as State.current_scene (-1 = none)
}

// --- commands -------------------------------------------------------------------------------------
message SetInsertChain {                 // structural; replaces the whole chain of a part
  uint32 part = 1;
  repeated InsertSlot slots = 2;
}

message SetSendLevels {                  // structural; initial send levels carried by the snapshot. RT applies a level on
                                         // the generation change only when it differs from the previous generation's
                                         // initial value; otherwise the live value (SetPerformanceParam, CC) is kept
  uint32 part = 1;
  float reverb = 2;
  float delay = 3;
}

message SetPartOutput {                  // structural
  uint32 part = 1;
  PartOutput output = 2;
}

message SetMasterParams {                // structural; all values or none
  repeated ParamValue values = 1;
}

message SetTimbreRef {                   // structural
  uint32 part = 1;
  uint32 timbre_ref = 2;
}

message SetPerformanceParam {            // performance; becomes a timestamped UMP, no new snapshot. The Ack means QUEUED for
                                         // RT, not applied: RT can still drop the event when its own queues overflow (it is
                                         // counted, never silent). Values travel as 32-bit normalised over the registry range,
                                         // so floats are quantised to ~2^-32 of the range; int/bool/enum are exact
  ParamId param_id = 1;
  uint32 part = 2;
  float value = 3;
}

// Scenes (Story 4.4). A recall is a parameter-only generation: it never loads heads or changes a timbre. next/previous step in scene order and
// stop at the first / last scene (SceneReply.result AT_FIRST / AT_LAST, nothing changes, no error). Replies: SceneReply + the revision after the
// command; errors: NO_SUCH_SCENE, NO_LIVE_SET, BUSY (ledger full or a Live Set load in progress), FX_BUDGET_EXCEEDED.
message RecallScene {
  uint32 index = 1;                      // 0-based scene index
}
message NextScene {}
message PreviousScene {}
enum SceneStepResult {
  SCENE_STEP_RESULT_UNSPECIFIED = 0;
  SCENE_STEP_RESULT_OK = 1;
  SCENE_STEP_RESULT_AT_FIRST = 2;        // previous_scene at the first scene
  SCENE_STEP_RESULT_AT_LAST = 3;         // next_scene at the last scene
}
message SceneReply {
  SceneStepResult result = 1;
  int32 current_scene = 2;               // after the command; -1 = none
}

// Live Set switching (Story 4.5). JumpToLiveSet returns at once: JumpReply says whether the load started (ACCEPTED), the target already sounds
// (ALREADY_LOADED, a no-op) or is already being loaded (ALREADY_LOADING, a no-op). A jump while another target loads cancels that load (its
// partial heads are freed) and starts the new one. Errors: NO_SUCH_LIVE_SET (unknown id, nothing changes). Everything that goes wrong while
// loading (budget, unreadable or invalid file, an instrument that cannot be made resident, the voice pool, ...) is reported in State.loading
// (state FAILED + last_error) and the current Live Set keeps playing. CancelLoad cancels the load in progress, if any (CancelLoadReply.cancelled).
message JumpToLiveSet {
  string id = 1;                         // Live Set id (UUIDv4 string)
}
enum JumpResult {
  JUMP_RESULT_UNSPECIFIED = 0;
  JUMP_RESULT_ACCEPTED = 1;
  JUMP_RESULT_ALREADY_LOADED = 2;
  JUMP_RESULT_ALREADY_LOADING = 3;
}
message JumpReply {
  JumpResult result = 1;
  string target_id = 2;
  string target_name = 3;
  bool superseded_previous = 4;          // another load was cancelled to start this one
}
message CancelLoad {}
message CancelLoadReply {
  bool cancelled = 1;                    // false: no load was in progress
}

// --- Story 4.6: setlists, tags, Live Set creation and stepping --------------------------------------------------------------------
// All of these are applied by the control thread (the sole writer), in the order they arrive, all or nothing: the file is written (atomic
// replace) BEFORE the new state is published, and a failure leaves the state and the file as they were. Success replies are Ack unless noted.
// Errors: NO_SUCH_SETLIST, NO_SUCH_TAG, NO_SUCH_LIVE_SET, DUPLICATE_LIVE_SET_IN_SETLIST, INVALID_NAME, INVALID_ORDER, LIMIT_REACHED,
// LIVE_SET_NOT_IN_SETLIST, LIVE_SET_IN_USE, STORAGE_FAILED, INVALID_COMMAND (setlists not available: the engine has no data directory).
message CreateSetlist { string name = 1; }                        // reply CreatedReply
message RenameSetlist { string id = 1; string name = 2; }
message ReorderSetlists { repeated string ids = 1; }              // the new order of ALL setlists: a permutation of the current ids
message DeleteSetlist { string id = 1; }                          // never deletes a Live Set; deleting the loaded setlist unloads it
message AddLiveSetToSetlist {
  string setlist_id = 1;
  string live_set_id = 2;                                         // must exist (NO_SUCH_LIVE_SET) and not be in the setlist yet
  optional uint32 index = 3;                                      // insert position, absent = append; past the end = INVALID_ORDER
}
message RemoveLiveSetFromSetlist { string setlist_id = 1; string live_set_id = 2; }
message ReorderLiveSetsInSetlist { string setlist_id = 1; repeated string live_set_ids = 2; }  // permutation of the setlist's current ids
message CreateLiveSet { string name = 1; }                        // 8 empty parts, one scene, ASSIGN copied from the default; reply CreatedReply
message DeleteLiveSet { string id = 1; }                          // also removes it from every setlist
message CreateTag { string name = 1; }                            // reply CreatedReply
message RenameTag { string id = 1; string name = 2; }
message DeleteTag { string id = 1; }                              // removes it from every setlist
message SetSetlistTags { string setlist_id = 1; repeated string tag_ids = 2; }  // replaces the setlist's tags (assign / remove)
message LoadSetlist { string id = 1; }                            // the current generation keeps playing; no Live Set is loaded; reply LoadSetlistReply
message UnloadSetlist {}                                          // no setlist loaded: stepping walks All Live Sets
message NextLiveSet {}                                            // reply StepReply, or END_OF_SETLIST / EMPTY_SETLIST / LIVE_SET_LOAD_FAILED errors
message PreviousLiveSet {}                                        // reply StepReply, or START_OF_SETLIST / EMPTY_SETLIST / LIVE_SET_LOAD_FAILED errors
message GetSetlists {
  string setlist_id = 1;                                          // "" = summaries only; else also the ordered entries of that setlist (NO_SUCH_SETLIST)
  bool include_all_live_sets = 2;                                 // Story 8.9: also fill SetlistsReply.all_live_sets (All Live Sets, for the Boot into picker)
}

// --- Story 9.8: the read-only Live Set view for Velora Studio -----------------------------------------------------------------------------------------
// GetLiveSetView answers LiveSetViewReply: one Live Set as Studio draws it (name, unsaved-edits flag, the 8 scene tiles, the parts), assembled from the stored
// Live Set and, when the device holds unsaved edits for it, from that edited copy. It is READ-ONLY: it never loads, publishes, recalls or jumps anything, the
// revision does not move and nothing is pushed. Errors: NO_SUCH_LIVE_SET (unknown id; details id), INVALID_COMMAND (empty id; no data directory), BUSY is never returned.
message GetLiveSetView { string live_set_id = 1; }
message LiveSetViewScene {
  uint32 index = 1;                      // 0..7; always 8 entries are sent
  string name = 2;                       // "" when empty
  bool empty = 3;                        // no scene stored at this index
}
message LiveSetViewPart {
  uint32 index = 1;                      // 0-based
  bool empty = 2;                        // a sample part with no timbre ("+ Add timbre")
  bool on = 3;                           // keyboard_on in the Live Set
  uint32 engine_type_id = 4;             // 1 sample, 2 organ, 3 FM, 4 VA (as PartState.engine_type_id)
  string timbre_name = 5;                // the library's instrument name; "" for empty, organ, FM / VA and missing-library parts (never another timbre's name)
  uint32 category = 6;                   // category.proto id (0 = none / unknown); organ parts carry CATEGORY_ORGAN
  float volume = 7;                      // 0..1
  uint32 low_key = 8;                    // 0..127
  uint32 high_key = 9;
  string organ_registration = 10;        // organ parts: the nine drawbars as "88 8000 000" (16', 5 1/3' | 8', 4', 2 2/3', 2' | 1 3/5', 1 1/3', 1'); "" otherwise
  bool missing_library = 11;             // the timbre's library or instrument cannot be resolved (library missing, instrument missing, bundle unreadable)
  string unavailable_reason = 12;        // with missing_library: why, as the resolver names it (missing_library | missing_instrument | bundle_error | invalid_link | identity_mismatch |
                                         // protected_downgrade | protected_unsupported | invalid_id); "" otherwise. Studio shows every one of them as "Missing library"
}
message LiveSetViewReply {
  string live_set_id = 1;
  string name = 2;
  bool dirty = 3;                        // the device holds unsaved edits for this Live Set (the ◆)
  bool sounding = 4;                     // this Live Set is the one that sounds right now
  repeated LiveSetViewScene scenes = 5;  // exactly 8
  repeated LiveSetViewPart parts = 6;    // the Live Set's parts: 8 on v1, 16 on Pro (Studio shows the first 8)
  uint32 part_count = 7;                 // == parts_size()
  uint32 scene_count = 8;                // scenes stored in the Live Set (0..8)
  bool factory = 9;                      // a factory Live Set (read-only on the unit)
}

message CreatedReply { string id = 1; string name = 2; bool not_durable = 3; }
message LoadSetlistReply { string setlist_id = 1; int32 position = 2; uint32 live_set_count = 3; }
message StepReply {
  string live_set_id = 1;                // the Live Set the step jumped to
  string live_set_name = 2;
  int32 position = 3;                    // index in the loaded setlist, or in All Live Sets when none is loaded
  JumpResult jump_result = 4;            // what the Story 4.5 switcher answered (ACCEPTED, ALREADY_LOADED, ALREADY_LOADING)
  bool superseded_previous = 5;
  bool in_setlist = 6;                   // false: the step walked All Live Sets
}
message SetlistTagInfo { string id = 1; string name = 2; }
message SetlistSummary {
  string id = 1;
  string name = 2;
  repeated string tag_ids = 3;
  uint32 live_set_count = 4;
  uint32 missing_count = 5;              // entries whose Live Set no longer exists (kept, flagged)
  bool loaded = 6;
}
message SetlistEntry { string live_set_id = 1; string name = 2; bool missing = 3; }
message SetlistsReply {
  repeated SetlistSummary setlists = 1;  // in list order
  repeated SetlistTagInfo tags = 2;
  SetlistStatus status = 3;
  string detail_setlist_id = 4;          // the setlist `entries` belongs to ("" when GetSetlists named none)
  repeated SetlistEntry entries = 5;
  repeated SetlistEntry all_live_sets = 6;  // Story 8.9: every Live Set in the catalog in All Live Sets order (name, case-insensitive ASCII, then id); only with include_all_live_sets; missing = false
}

// --- Story 4.9: edits, Write and the part commands that give them something to edit -----------------------------------------------------
// WriteLiveSet writes the CURRENT Live Set only (never another one). The control thread raises a fence to RT, waits for the acknowledgement, reads the
// last-value table, then writes per scope: SCENE = the current scene's stored parameters (refused with WRITE_SCOPE_UNAVAILABLE when no scene is current,
// there are no scenes, or a timbre / engine change is pending), WHOLE_LIVE_SET = everything (base, every scene, master, ASSIGN), SAVE_AS_NEW = a new
// Live Set (new UUIDv4, `new_name` or a suggestion) added after the current one in the loaded setlist; the current Live Set keeps its unsaved edits.
// Errors: NO_LIVE_SET, BUSY (details reason = load_in_progress | reload_in_progress | fence_timeout | fence_queue_full | generation_not_applied), NAME_IN_USE, INVALID_NAME, WRITE_SCOPE_UNAVAILABLE (reason = timbre_change | no_scene | no_scenes | scene_not_in_saved | factory_read_only: Story 6.9, a factory Live Set is saved only with Save as new),
// STORAGE_FULL, STORAGE_FAILED, INVALID_COMMAND. A success moves the revision by one and replies WriteReply.
enum WriteScope {
  WRITE_SCOPE_UNSPECIFIED = 0;
  WRITE_SCOPE_SCENE = 1;
  WRITE_SCOPE_WHOLE_LIVE_SET = 2;
  WRITE_SCOPE_SAVE_AS_NEW = 3;
}
message WriteLiveSet {
  WriteScope scope = 1;
  optional string new_name = 2;          // SAVE_AS_NEW only; absent = a suggested free name
}
message WriteReply {
  WriteScope scope = 1;
  string live_set_id = 2;                // the Live Set that sounds (the one the Write was about)
  string written_live_set_id = 3;        // the file written: the same id, or the new Live Set's id for SAVE_AS_NEW
  string written_name = 4;
  int32 scene = 5;                       // SCENE: the scene written; otherwise -1
  repeated ChangeItem written = 6;       // what was written (at most 32 items)
  uint32 written_count = 7;
  bool nothing_to_write = 8;             // nothing was dirty for this scope: no file was touched
  bool current_dirty = 9;                // the current Live Set still has unsaved edits after the command
  uint32 remaining_changes = 10;
  bool not_durable = 11;                 // the file is in place but the directory sync failed
  string setlist_id = 12;                // SAVE_AS_NEW: the setlist the new Live Set was added to ("" = none loaded)
  int32 setlist_index = 13;              // its index there, -1 when none
}
// Assigns a part's timbre (library_id + instrument_key, both empty = no timbre) and optionally its engine type. An in-memory edit: the Live Set is
// rebuilt from its edited state in the background by the same seamless path as a Live Set switch (the sound keeps playing; State.loading shows it;
// the current scene is recalled again when it is done). Persisted by WHOLE_LIVE_SET / SAVE_AS_NEW only.
message SetPartTimbre {
  uint32 part = 1;
  string library_id = 2;
  string instrument_key = 3;
  optional uint32 engine_type_id = 4;
}
message SetPartVolume {                  // structural; the part fader (0..1) as the generation's field (not a live value)
  uint32 part = 1;
  float volume = 2;
}

// --- Story 4.10: ASSIGN maps and encoder mode -----------------------------------------------------------------------------------------
// SetAssignSlot / ClearAssignSlot edit one slot K1..K8 (`slot` is 1-based, 1..8; 0 is INVALID_SLOT) of the map of the CURRENT Live Set (an
// in-memory edit like any other: the Live Set becomes dirty with change key `assign.slot`, the map applies at once, and Write persists it) or of the GLOBAL
// DEFAULT (a settings edit: written to assign_default.pb immediately and atomically, no Write needed, existing Live Sets are not changed, a Live Set created later
// copies it). SetAssignSlot needs a registry performance parameter that is assignable; the same parameter in several slots is allowed. Clearing makes the slot
// empty (turning that encoder does nothing). Errors: INVALID_SLOT (details slot, max_slot), INVALID_COMMAND (no/unknown target; the target needs a data
// directory), UNKNOWN_PARAM, NOT_ASSIGNABLE, NO_LIVE_SET (CURRENT_LIVE_SET with no Live Set loaded), BUSY (a Live Set load or rebuild is in progress), STORAGE_FAILED / STORAGE_FULL.
enum AssignTarget {
  ASSIGN_TARGET_UNSPECIFIED = 0;
  ASSIGN_TARGET_CURRENT_LIVE_SET = 1;
  ASSIGN_TARGET_GLOBAL_DEFAULT = 2;
}
message SetAssignSlot {
  AssignTarget target = 1;
  uint32 slot = 2;                       // 1..8 (K1..K8)
  uint32 param_id = 3;
}
message ClearAssignSlot {
  AssignTarget target = 1;
  uint32 slot = 2;
}
// SetEncoderMode: the engine's encoder mode flag PART / ALL / ASSIGN (a UMP on the control lane; State.encoders shows it). Story 4.13 gives PART and ALL their
// functions; today only ASSIGN routes. SelectPart: the part that part-scope ASSIGN parameters land on (default 0; INVALID_PART above the last part).
message SetEncoderMode {
  EncoderMode mode = 1;
}
message SelectPart {
  uint32 part = 1;
}

// Story 4.12: Fader bindings with pickup.
message SetFaderMode {
  FaderMode mode = 1;
}
message SelectOrganPart {
  uint32 part = 1;
}
message MoveFader {
  uint32 fader_index = 1;                // 0..8 (Fader 1..9)
  float position = 2;                    // 0..1 normalized physical fader position
}

message GetState {}
message GetPerformanceValues {}
// Story 1.21: fixed-bin histogram. Bin i < edges_us.size() counts values in [edges_us[i-1], edges_us[i]) (edges_us[-1] = 0); the last bin
// (counts.size() == edges_us.size() + 1) is the overflow bin, values >= the last edge.
message Histogram {
  repeated uint32 edges_us = 1;
  repeated uint64 counts = 2;
}

message DiagnosticsReply {
  uint64 xrun = 1;                       // block renders over their deadline plus device-reported xruns
  uint64 voice_steal = 2;
  uint64 voice_exhausted = 3;
  uint64 stream_underrun = 4;            // stays 0 until streaming (Story 1.17) feeds it
  uint64 uptime_ms = 5;                  // since the control plane started
  Histogram render_time = 6;             // block render duration
  Histogram latency = 7;                 // event host timestamp -> onset
}

message GetDiagnostics {}                // Story 1.21: in-RAM health counters and histograms (after Hello)
message Subscribe {                      // after this, every new revision is pushed as a State message
  bool enable = 1;
}

// Story 3.12: drive one panel LED (LED_SET frame, MCU-ID-MAP.md section 8). Only the engine writes the panel link: it turns this into an LED_SET frame
// through the panel reader and remembers the state (replayed when the panel MCU reconnects). The ui owns the toggle state, the patterns and the timing.
message SetLed {
  uint32 led_id = 1;                     // an LED id of the ID map (unknown -> ERROR_CODE_UNKNOWN_LED, nothing is sent)
  uint32 brightness = 2;                 // 0..255 (above -> ERROR_CODE_OUT_OF_RANGE)
  uint32 arg = 3;                        // 0..255: colour index for single LEDs, fill position for rings
}

// --- sysd config (Foundation: sysd config service; served by velora-sysd, never by the engine) ------------------------------------------
// The system configuration is owned by sysd (AR17, AR39, AD-12) and reaches the engine and the ui at start and on change. These messages are the
// whole of its protocol: the stories that add a setting (clock source 7.7, velocity curve 3.6, pedal calibration 3.11, Boot into 8.9) add behaviour
// that consumes the published Config; they need no protocol change beyond adding a field to Config / ConfigPatch (additive, numbers never reused).
enum ClockSource {
  CLOCK_SOURCE_UNSPECIFIED = 0;        // never valid in a SetConfig
  CLOCK_SOURCE_INTERNAL = 1;           // default
  CLOCK_SOURCE_DIN = 2;
  CLOCK_SOURCE_USB = 3;
}

enum VelocityCurve {
  VELOCITY_CURVE_UNSPECIFIED = 0;
  VELOCITY_CURVE_NORMAL = 1;           // default
  VELOCITY_CURVE_LIGHT = 2;
  VELOCITY_CURVE_HEAVY = 3;
  VELOCITY_CURVE_FIXED = 4;
}

enum PedalPolarity {
  PEDAL_POLARITY_UNSPECIFIED = 0;      // not fixed by the player: the polarity detected at boot (Story 3.8) is used
  PEDAL_POLARITY_NORMALLY_OPEN = 1;
  PEDAL_POLARITY_NORMALLY_CLOSED = 2;
}

enum BootIntoMode {
  BOOT_INTO_MODE_UNSPECIFIED = 0;
  BOOT_INTO_MODE_LAST_SOUND = 1;       // default
  BOOT_INTO_MODE_START_OF_SETLIST = 2;
  BOOT_INTO_MODE_DEFAULT_LIVE_SET = 3; // needs a default_live_set_id
}

// Raw pedal range as the MCU reports it (12 bit, mcu/common/MCU-ID-MAP.md section 6). min == max == 0 means "not calibrated".
message PedalCalibration {
  uint32 min = 1;                      // 0..4095
  uint32 max = 2;                      // 0..4095; calibrated values need min < max
  PedalPolarity polarity = 3;
}

message BootIntoConfig {
  BootIntoMode mode = 1;
  string default_live_set_id = 2;      // empty, or a Live Set id (a canonical lowercase UUID, Story 8.9; a legacy 1..64 [A-Za-z0-9_-] value already stored still loads, and with DEFAULT_LIVE_SET loads as LAST_SOUND); a UUID is required with DEFAULT_LIVE_SET
}

// The configuration sysd publishes. A field the reader does not know is ignored; a field absent from the wire has the default documented above.
message Config {
  ClockSource clock_source = 1;
  VelocityCurve velocity_curve = 2;
  PedalCalibration sustain = 3;
  PedalCalibration expression = 4;
  BootIntoConfig boot_into = 5;
}

// Field-wise patches: only the scalar fields that are present change, the others keep their stored value (so setting only a pedal's polarity, or only the
// Live Set id of Boot into, never clears its other fields). Same field numbers and wire types as PedalCalibration / BootIntoConfig.
message PedalPatch {
  optional uint32 min = 1;
  optional uint32 max = 2;
  optional PedalPolarity polarity = 3;
}

message BootIntoPatch {
  optional BootIntoMode mode = 1;
  optional string default_live_set_id = 2;
}

// A partial update: only the fields that are present change (a present sub-message changes only its present fields). The result is validated as a whole.
message ConfigPatch {
  optional ClockSource clock_source = 1;
  optional VelocityCurve velocity_curve = 2;
  optional PedalPatch sustain = 3;
  optional PedalPatch expression = 4;
  optional BootIntoPatch boot_into = 5;
}

message GetConfig {}
message SetConfig {
  ConfigPatch patch = 1;
}
message SubscribeConfig {              // after this the full Config is pushed at once and again on every change (request_id 0)
  bool enable = 1;
}

message ConfigReply {
  Config config = 1;
  uint64 revision = 2;                 // strictly increasing with every change, persisted: it survives a sysd restart
  bool not_durable = 3;                // SetConfig only: the new file is in place but the directory sync failed (applied, may be lost on power loss)
}

// --- pedal calibration (Story 3.11; served by the ENGINE's control plane, which measures the raw pedal and writes the result to sysd) ---------------
// The player presses the pedal fully and releases it between Start and Finish. The engine keeps the raw 12-bit minimum and maximum it saw (it owns the panel
// reader); Finish validates them (max - min >= 256 counts) and stores them in the sysd config (revision + 1); the pedal then maps over that range.
enum PedalKind {
  PEDAL_KIND_UNSPECIFIED = 0;          // never valid
  PEDAL_KIND_SUSTAIN = 1;
  PEDAL_KIND_EXPRESSION = 2;
}

message StartPedalCalibration {
  PedalKind pedal = 1;                 // unspecified / unknown -> ERROR_CODE_UNKNOWN_ENUM_VALUE. Starting while another calibration runs replaces it
}
message FinishPedalCalibration {       // ends the running calibration: validates the measured range and stores it in sysd
  uint64 run_token = 1;                // the run_token of the Start reply; another one while a run is active -> ERROR_CODE_INVALID_COMMAND (details.reason = wrong_run_token)
}
message CancelPedalCalibration {       // ends the running calibration; nothing is stored
  uint64 run_token = 1;                // as for Finish
}

enum PedalCalibrationResult {
  PEDAL_CALIBRATION_RESULT_UNSPECIFIED = 0;
  PEDAL_CALIBRATION_RESULT_COLLECTING = 1;     // Start: the engine is measuring
  PEDAL_CALIBRATION_RESULT_STORED = 2;         // Finish: min / max were written to sysd (revision in the reply)
  PEDAL_CALIBRATION_RESULT_CANCELLED = 3;      // Cancel (or a Start that replaced a running calibration); config unchanged
  PEDAL_CALIBRATION_RESULT_NO_MOVEMENT = 4;    // Finish: the pedal never moved (no frame, or min == max); config unchanged
  PEDAL_CALIBRATION_RESULT_TOO_SMALL_SPAN = 5; // Finish: max - min below 256 counts (min / max report what was measured); config unchanged
  PEDAL_CALIBRATION_RESULT_TIMED_OUT = 6;      // Finish after the calibration window (60 s) elapsed; config unchanged
  PEDAL_CALIBRATION_RESULT_NOT_RUNNING = 7;    // Finish / Cancel with no calibration running
  PEDAL_CALIBRATION_RESULT_SYSD_UNAVAILABLE = 8;  // the engine has no sysd link (or it is down / answered too late): nothing stored
  PEDAL_CALIBRATION_RESULT_SYSD_REFUSED = 9;      // sysd rejected the values (detail = error code and reason); nothing stored
}

message PedalCalibrationReply {
  PedalCalibrationResult result = 1;
  PedalKind pedal = 2;
  uint32 min = 3;                      // measured raw minimum (Finish; 0 otherwise)
  uint32 max = 4;                      // measured raw maximum
  uint64 config_revision = 5;          // STORED: the sysd config revision after the write
  bool not_durable = 6;                // STORED: sysd applied the change but its directory sync failed
  uint64 run_token = 8;                // COLLECTING (Start reply): identifies the run; Finish / Cancel must carry it, so a second client's Start cannot be finished by the first
  string detail = 7;                   // SYSD_REFUSED / SYSD_UNAVAILABLE: what sysd said
}

message ClientMessage {
  uint64 request_id = 1;                 // echoed in the reply; chosen by the client
  // Story 9.9 (additive): the State revision the client's view was built on when it made this edit (0 = not provided, accepted exactly as before). The engine
  // records it for edit commands and IGNORES it: the STALE_REVISION rejection and the live-edit banner are Story 9.10.
  uint64 base_revision = 2;
  oneof body {
    Hello hello = 10;
    SetInsertChain set_insert_chain = 11;
    SetSendLevels set_send_levels = 12;
    SetPartOutput set_part_output = 13;
    SetMasterParams set_master_params = 14;
    SetTimbreRef set_timbre_ref = 15;
    SetPerformanceParam set_performance_param = 16;
    GetState get_state = 17;
    GetPerformanceValues get_performance_values = 18;
    Subscribe subscribe = 19;
    RecallScene recall_scene = 20;       // Story 4.4
    NextScene next_scene = 21;
    PreviousScene previous_scene = 22;
    JumpToLiveSet jump_to_live_set = 23;  // Story 4.5
    CancelLoad cancel_load = 24;
    CreateSetlist create_setlist = 25;    // Story 4.6
    RenameSetlist rename_setlist = 26;
    ReorderSetlists reorder_setlists = 27;
    DeleteSetlist delete_setlist = 28;
    AddLiveSetToSetlist add_live_set_to_setlist = 29;
    RemoveLiveSetFromSetlist remove_live_set_from_setlist = 30;
    ReorderLiveSetsInSetlist reorder_live_sets_in_setlist = 31;
    CreateLiveSet create_live_set = 32;
    DeleteLiveSet delete_live_set = 33;
    CreateTag create_tag = 34;
    RenameTag rename_tag = 35;
    DeleteTag delete_tag = 36;
    SetSetlistTags set_setlist_tags = 37;
    LoadSetlist load_setlist = 38;
    UnloadSetlist unload_setlist = 39;
    NextLiveSet next_live_set = 40;
    PreviousLiveSet previous_live_set = 41;
    GetSetlists get_setlists = 42;
    SetPartTimbre set_part_timbre = 43;   // Story 4.9
    WriteLiveSet write_live_set = 44;
    SetPartVolume set_part_volume = 45;
    SetAssignSlot set_assign_slot = 46;   // Story 4.10
    ClearAssignSlot clear_assign_slot = 47;
